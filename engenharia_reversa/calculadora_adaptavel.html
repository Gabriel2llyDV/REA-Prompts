<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora REA - Engenharia Reversa & Automação</title>
  <style>
    :root {
      --bg: #07111f;
      --bg2: #0f172a;
      --panel: rgba(15, 23, 42, 0.96);
      --panelSoft: rgba(17, 24, 39, 0.82);
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5eefb;
      --muted: #9fb0c7;
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #8b5cf6;
      --cyan: #22d3ee;
      --button: #dfeafc;
      --buttonText: #111827;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0d1b2a 0%, #07111f 45%, #040b14 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 18px 40px var(--shadow);
    }

    h2 {
      margin: 0 0 18px;
      font-size: 1.5rem;
      color: #f8fafc;
    }

    .display {
      width: 100%;
      height: 78px;
      border: none;
      border-radius: 12px;
      background: #020817;
      color: #f8fafc;
      font-size: 2rem;
      text-align: right;
      padding: 14px 16px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 18px 0;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform .12s ease, opacity .12s ease, filter .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.04);
    }

    .number { background: var(--button); color: var(--buttonText); }
    .operator { background: var(--warning); color: white; }
    .action { background: #9ca3af; color: #111827; }
    .equal { background: var(--success); color: white; grid-column: span 2; }
    .primary { background: linear-gradient(135deg, var(--primary), var(--cyan)); color: white; }
    .secondary { background: rgba(139, 92, 246, 0.18); color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.28); }

    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 1rem;
    }

    .description {
      margin: 12px 0 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(59,130,246,.08);
      border: 1px solid rgba(59,130,246,.18);
      color: #dbeafe;
      line-height: 1.5;
    }

    .adaptive-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .adaptive-actions button {
      flex: 1;
    }

    .results {
      margin-top: 18px;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .results h3 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      color: var(--muted);
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.98rem;
    }

    .stat:last-child { border-bottom: none; }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: bold;
    }

    .green { background: rgba(16,185,129,.15); color: #6ee7b7; }
    .red { background: rgba(239,68,68,.12); color: #fca5a5; }
    .blue { background: rgba(59,130,246,.15); color: #93c5fd; }
    .purple { background: rgba(139,92,246,.15); color: #c4b5fd; }
    .amber { background: rgba(245,158,11,.12); color: #fcd34d; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h2>Calculadora Básica</h2>
      <input class="display" id="display" type="text" readonly value="0" />

      <div class="buttons">
        <button class="action" onclick="clearDisplay()">C</button>
        <button class="action" onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="appendValue('/')">/</button>
        <button class="operator" onclick="appendValue('*')">*</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">-</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculateResult()">=</button>

        <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button class="number" onclick="appendValue('.')">.</button>
      </div>
    </div>

    <div class="panel">
      <h2>REA / Engenharia Reversa / Automação</h2>

      <select id="profileSelect" aria-label="Selecione a finalidade">
        <option value="reverse">Análise de reversão</option>
        <option value="complexity">Complexidade de alvo</option>
        <option value="automation">Automação de análise</option>
        <option value="detection">Detecção / anti-analysis</option>
        <option value="effort">Esforço estimado</option>
        <option value="custom">Personalizado</option>
      </select>

      <div id="description" class="description"></div>
      <div id="dynamicInputs"></div>

      <div class="adaptive-actions">
        <button class="primary" id="calcAdaptive">Calcular</button>
        <button class="secondary" id="resetAdaptive">Resetar</button>
      </div>

      <div id="results" class="results"></div>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");
    let expression = "";

    function appendValue(value) {
      if (display.value === "Error") {
        expression = "";
        display.value = "0";
      }
      expression += value;
      display.value = expression;
    }

    function clearDisplay() {
      expression = "";
      display.value = "0";
    }

    function deleteLast() {
      expression = expression.slice(0, -1);
      display.value = expression || "0";
    }

    function calculateResult() {
      try {
        const safeExpression = expression.replace(/×/g, "*").replace(/÷/g, "/");
        if (!/^[0-9+\-*/.() ]+$/.test(safeExpression)) {
          throw new Error("Expressão inválida");
        }
        const result = Function(`"use strict"; return (${safeExpression})`)();
        if (!Number.isFinite(result)) {
          throw new Error("Resultado inválido");
        }
        expression = String(result);
        display.value = expression;
      } catch {
        display.value = "Error";
        expression = "";
      }
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key;
        if (/^[0-9]$/.test(key) || ["+", "-", "*", "/", "."].includes(key)) {
          appendValue(key);
        } else if (key === "Enter" || key === "=") {
          calculateResult();
        } else if (key === "Backspace") {
          deleteLast();
        } else if (key === "Escape") {
          clearDisplay();
        }
    });

    const profiles = {
      reverse: {
        label: "Análise de reversão",
        description: "Estima facilidade ou dificuldade de analisar um alvo, considerando obfuscação, proteção, documentação e dependências.",
        fields: [
          { id: "complexidade", label: "Complexidade do alvo (%)", value: 72, type: "number" },
          { id: "obfuscacao", label: "Obfuscação (%)", value: 60, type: "number" },
          { id: "documentacao", label: "Documentação disponível (%)", value: 48, type: "number" },
          { id: "dependencias", label: "Dependências críticas (nº)", value: 5, type: "number" }
        ],
        calculate: (values) => {
          const complex = Number(values.complexidade) || 0;
          const obf = Number(values.obfuscacao) || 0;
          const doc = Number(values.documentacao) || 0;
          const deps = Number(values.dependencias) || 0;

          const score = (complex * 0.4) + (obf * 0.3) + ((100 - doc) * 0.2) + (deps * 5);
          const reversibilidade = Math.max(0, 100 - score / 1.8);
          const risco = Math.max(0, score * 0.9);
          const recomendacao = reversibilidade >= 60 ? "Análise viável" : reversibilidade >= 35 ? "Requer planejamento" : "Muito difícil";

          return {
            indicadores: [
              { label: "Score de reversibilidade", value: `${reversibilidade.toFixed(2)}%` },
              { label: "Risco de análise", value: `${risco.toFixed(2)}%` },
              { label: "Elasticidade de dependências", value: `${deps}` },
              { label: "Recomendação", value: recomendacao }
            ],
            status: recomendacao,
            statusClass: reversibilidade >= 60 ? "green" : reversibilidade >= 35 ? "amber" : "red"
          };
        }
      },

      complexity: {
        label: "Complexidade de alvo",
        description: "Avalia a profundidade técnica de um alvo e a chance de encontrar pontos de entrada, padrões e vulnerabilidades.",
        fields: [
          { id: "camadas", label: "Camadas de proteção (%)", value: 55, type: "number" },
          { id: "criptografia", label: "Criptografia / anti-tamper (%)", value: 62, type: "number" },
          { id: "modularizacao", label: "Modularização (%)", value: 40, type: "number" },
          { id: "sinais", label: "Sinais de engenharia (%)", value: 68, type: "number" }
        ],
        calculate: (values) => {
          const camadas = Number(values.camadas) || 0;
          const crypto = Number(values.criptografia) || 0;
          const modular = Number(values.modularizacao) || 0;
          const sinais = Number(values.sinais) || 0;

          const score = (camadas * 0.35) + (crypto * 0.3) + ((100 - modular) * 0.15) + (sinais * 0.2);
          const nivel = Math.min(100, score);
          const recomendacao = nivel >= 70 ? "Alvo de alta complexidade" : nivel >= 45 ? "Alvo moderado" : "Alvo acessível";

          return {
            indicadores: [
              { label: "Nível de complexidade", value: `${nivel.toFixed(2)}%` },
              { label: "Proteções combinadas", value: `${(camadas + crypto).toFixed(2)}%` },
              { label: "Visibilidade de estrutura", value: `${(100 - (100 - modular)).toFixed(2)}%` },
              { label: "Diagnóstico", value: recomendacao }
            ],
            status: recomendacao,
            statusClass: nivel >= 70 ? "red" : nivel >= 45 ? "amber" : "green"
          };
        }
      },

      automation: {
        label: "Automação de análise",
        description: "Meça o quanto o processo pode ser automatizado com scripts, heurísticas, rastreio e extração de artefatos.",
        fields: [
          { id: "script", label: "Cobertura de scripts (%)", value: 72, type: "number" },
          { id: "heuristica", label: "Heurísticas disponíveis (%)", value: 64, type: "number" },
          { id: "instrumentacao", label: "Instrumentação (%)", value: 58, type: "number" },
          { id: "ferramentas", label: "Ferramentas automáticas (nº)", value: 7, type: "number" }
        ],
        calculate: (values) => {
          const script = Number(values.script) || 0;
          const heur = Number(values.heuristica) || 0;
          const inst = Number(values.instrumentacao) || 0;
          const tools = Number(values.ferramentas) || 0;

          const score = (script * 0.35) + (heur * 0.3) + (inst * 0.2) + (tools * 4);
          const automacao = Math.min(100, score);
          const capacidade = automacao >= 70 ? "Alta automação" : automacao >= 45 ? "Automação parcial" : "Baixa automação";

          return {
            indicadores: [
              { label: "Automação estimada", value: `${automacao.toFixed(2)}%` },
              { label: "Cobertura funcional", value: `${script.toFixed(2)}%` },
              { label: "Heurísticas", value: `${heur.toFixed(2)}%` },
              { label: "Status", value: capacidade }
            ],
            status: capacidade,
            statusClass: automacao >= 70 ? "green" : automacao >= 45 ? "blue" : "amber"
          };
        }
      },

      detection: {
        label: "Detecção / anti-analysis",
        description: "Avalia a presença de mecanismos de anti-debug, anti-VM, anti-hooking e bloqueio de análise em sandbox.",
        fields: [
          { id: "antidebug", label: "Anti-debug (%)", value: 68, type: "number" },
          { id: "antivm", label: "Anti-VM (%)", value: 54, type: "number" },
          { id: "hooking", label: "Anti-hooking (%)", value: 71, type: "number" },
          { id: "sandbox", label: "Bloqueio em sandbox (%)", value: 58, type: "number" }
        ],
        calculate: (values) => {
          const antiDebug = Number(values.antidebug) || 0;
          const antiVM = Number(values.antivm) || 0;
          const hooking = Number(values.hooking) || 0;
          const sandbox = Number(values.sandbox) || 0;

          const score = (antiDebug * 0.28) + (antiVM * 0.25) + (hooking * 0.27) + (sandbox * 0.2);
          const risco = Math.min(100, score);
          const status = risco >= 70 ? "Detecção alta" : risco >= 45 ? "Detecção moderada" : "Detecção baixa";

          return {
            indicadores: [
              { label: "Nível de detecção", value: `${risco.toFixed(2)}%` },
              { label: "Anti-debug", value: `${antiDebug.toFixed(2)}%` },
              { label: "Anti-VM", value: `${antiVM.toFixed(2)}%` },
              { label: "Status", value: status }
            ],
            status,
            statusClass: risco >= 70 ? "red" : risco >= 45 ? "amber" : "green"
          };
        }
      },

      effort: {
        label: "Esforço estimado",
        description: "Calcula o esforço de análise em tempo e recursos para descrever a profundidade da investigação necessária.",
        fields: [
          { id: "tempo", label: "Tempo disponível (horas)", value: 18, type: "number" },
          { id: "recursos", label: "Recursos técnicos (nº)", value: 4, type: "number" },
          { id: "profundidade", label: "Profundidade requerida (%)", value: 76, type: "number" },
          { id: "equipe", label: "Equipe envolvida (nº)", value: 2, type: "number" }
        ],
        calculate: (values) => {
          const tempo = Number(values.tempo) || 0;
          const recursos = Number(values.recursos) || 0;
          const profundidade = Number(values.profundidade) || 0;
          const equipe = Number(values.equipe) || 0;

          const score = (profundidade * 0.55) + (recursos * 6) + (equipe * 8) - (tempo * 1.5);
          const esforco = Math.max(0, Math.min(100, score));
          const status = esforco >= 70 ? "Esforço alto" : esforco >= 40 ? "Esforço moderado" : "Esforço baixo";

          return {
            indicadores: [
              { label: "Esforço estimado", value: `${esforco.toFixed(2)}%` },
              { label: "Tempo disponível", value: `${tempo}h` },
              { label: "Profundidade", value: `${profundidade.toFixed(2)}%` },
              { label: "Status", value: status }
            ],
            status,
            statusClass: esforco >= 70 ? "red" : esforco >= 40 ? "amber" : "green"
          };
        }
      },

      custom: {
        label: "Personalizado",
        description: "Modelo flexível para adaptar a análise a um alvo específico, com pesos customizáveis para risco, dificuldade e automatização.",
        fields: [
          { id: "v1", label: "Dificuldade", value: 65, type: "number" },
          { id: "v2", label: "Risco", value: 58, type: "number" },
          { id: "v3", label: "Automação", value: 74, type: "number" },
          { id: "p1", label: "Peso dificuldade (%)", value: 40, type: "number" },
          { id: "p2", label: "Peso risco (%)", value: 35, type: "number" },
          { id: "p3", label: "Peso automação (%)", value: 25, type: "number" }
        ],
        calculate: (values) => {
          const v1 = Number(values.v1) || 0;
          const v2 = Number(values.v2) || 0;
          const v3 = Number(values.v3) || 0;
          const p1 = Number(values.p1) || 0;
          const p2 = Number(values.p2) || 0;
          const p3 = Number(values.p3) || 0;

          const total = (p1 + p2 + p3) || 1;
          const score = ((v1 * p1) + (v2 * p2) + (v3 * p3)) / total;
          const status = score >= 60 ? "Alvo estratégico" : score >= 40 ? "Alvo adequado" : "Alvo simples";

          return {
            indicadores: [
              { label: "Score adaptativo", value: `${score.toFixed(2)} pts` },
              { label: "Dificuldade", value: `${v1.toFixed(2)}%` },
              { label: "Risco", value: `${v2.toFixed(2)}%` },
              { label: "Automação", value: `${v3.toFixed(2)}%` }
            ],
            status,
            statusClass: score >= 60 ? "purple" : score >= 40 ? "blue" : "green"
          };
        }
      }
    };

    function renderProfileInputs(profileKey) {
      const profile = profiles[profileKey];
      const dynamicInputs = document.getElementById("dynamicInputs");
      const description = document.getElementById("description");
      description.textContent = profile.description;

      dynamicInputs.innerHTML = profile.fields.map(field => `
        <div class="field">
          <label for="${field.id}">${field.label}</label>
          <input id="${field.id}" type="${field.type}" value="${field.value}" />
        </div>
      `).join("");
    }

    function renderResults(resultData) {
      const results = document.getElementById("results");
      const statusBadge = `<span class="badge ${resultData.statusClass}">${resultData.status}</span>`;

      results.innerHTML = `
        <h3>Resultado</h3>
        <div class="stat">
          <span>Status</span>
          <strong>${statusBadge}</strong>
        </div>
        ${resultData.indicadores.map(item => `
          <div class="stat">
            <span>${item.label}</span>
            <strong>${item.value}</strong>
          </div>
        `).join("")}
      `;
    }

    function calculateAdaptive() {
      const profileKey = document.getElementById("profileSelect").value;
      const profile = profiles[profileKey];
      const inputs = {};
      profile.fields.forEach(field => {
        const element = document.getElementById(field.id);
        if (element) inputs[field.id] = element.value;
      });
      const result = profile.calculate(inputs);
      renderResults(result);
    }

    document.getElementById("profileSelect").addEventListener("change", (event) => {
      renderProfileInputs(event.target.value);
      calculateAdaptive();
    });

    document.getElementById("calcAdaptive").addEventListener("click", calculateAdaptive);
    document.getElementById("resetAdaptive").addEventListener("click", () => {
      renderProfileInputs(document.getElementById("profileSelect").value);
      calculateAdaptive();
    });

    renderProfileInputs("reverse");
    calculateAdaptive();
  </script>
</body>
</html>
